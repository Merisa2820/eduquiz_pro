                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Laporan Evaluasi Pembelajaran</span>
                                <h2 class="text-2xl font-extrabold text-slate-900 mt-1">Rekap Nilai & Analitik Capaian Siswa</h2>
                                <p class="text-xs text-slate-500 mt-1">Pantau distribusi nilai, ketuntasan KKM, serta unduh laporan hasil ujian dalam format CSV (Excel).</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2.5">
                                <button onclick="app.exportResultsCSV()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md transition flex items-center gap-2">
                                    <i class="fas fa-file-excel"></i> Export ke CSV (Excel)
                                </button>
                                ${allResults.length > 0 ? `
                                    <button onclick="app.clearAllResults()" class="px-4 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold transition flex items-center gap-2">
                                        <i class="fas fa-trash"></i> Bersihkan Riwayat
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Kartu Statistik Ringkas -->
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <div class="text-xs font-semibold text-slate-400 mb-1">Rata-rata Nilai</div>
                                <div class="text-3xl font-extrabold text-indigo-600">${avgScore}</div>
                                <div class="text-[11px] text-slate-500 mt-1">Dari ${count} data peserta</div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <div class="text-xs font-semibold text-slate-400 mb-1">Nilai Tertinggi</div>
                                <div class="text-3xl font-extrabold text-emerald-600">${maxScore}</div>
                                <div class="text-[11px] text-slate-500 mt-1">Capaian maksimal</div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <div class="text-xs font-semibold text-slate-400 mb-1">Nilai Terendah</div>
                                <div class="text-3xl font-extrabold text-amber-600">${minScore}</div>
                                <div class="text-[11px] text-slate-500 mt-1">Perlu pendampingan</div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <div class="text-xs font-semibold text-slate-400 mb-1">Ketuntasan (Lulus KKM)</div>
                                <div class="text-3xl font-extrabold text-slate-900">${passRate}%</div>
                                <div class="text-[11px] text-slate-500 mt-1">${passedCount} Lulus &bull; ${remedialCount} Remedial</div>
                            </div>
                        </div>

                        <!-- Visualisasi Progress Bar Ketuntasan -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between text-xs font-bold mb-2">
                                <span class="text-emerald-700"><i class="fas fa-check-circle mr-1"></i>Lulus KKM (${passedCount} Siswa - ${passRate}%)</span>
                                <span class="text-rose-600"><i class="fas fa-exclamation-circle mr-1"></i>Remedial (${remedialCount} Siswa - ${count > 0 ? 100 - passRate : 0}%)</span>
                            </div>
                            <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden flex">
                                <div style="width: ${passRate}%" class="bg-emerald-500 h-full transition-all duration-500"></div>
                                <div style="width: ${count > 0 ? 100 - passRate : 0}%" class="bg-rose-500 h-full transition-all duration-500"></div>
                            </div>
                        </div>

                        <!-- Filter & Pencarian -->
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                    <i class="fas fa-search text-xs"></i>
                                </span>
                                <input type="text" value="${this.escapeHtml(f.search)}"
                                    oninput="app.updateAnalyticsFilter('search', this.value)"
                                    placeholder="Cari nama siswa atau NIS..."
                                    class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-xs">
                            </div>

                            <div>
                                <select onchange="app.updateAnalyticsFilter('classFilter', this.value)"
                                    class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-xs bg-white">
                                    <option value="ALL">Semua Kelas / Rombel</option>
                                    ${uniqueClasses.map(c => `<option value="${c}" ${f.classFilter === c ? 'selected' : ''}>Kelas ${c}</option>`).join('')}
                                </select>
                            </div>

                            <div>
                                <select onchange="app.updateAnalyticsFilter('quizFilter', this.value)"
                                    class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-xs bg-white">
                                    <option value="ALL">Semua Paket Kuis</option>
                                    ${this.state.quizzes.map(q => `<option value="${q.id}" ${f.quizFilter === q.id ? 'selected' : ''}>${this.escapeHtml(q.subject)} - ${this.escapeHtml(q.title)}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <!-- Tabel Hasil Pengerjaan Peserta Didik -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                                            <th class="py-3.5 px-4">Peserta Didik</th>
                                            <th class="py-3.5 px-4">Kelas</th>
                                            <th class="py-3.5 px-4">Paket Kuis</th>
                                            <th class="py-3.5 px-4 text-center">B / S / K</th>
                                            <th class="py-3.5 px-4 text-center">Skor</th>
                                            <th class="py-3.5 px-4 text-center">Status</th>
                                            <th class="py-3.5 px-4">Waktu & Tanggal</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-xs">
                                        ${filtered.length === 0 ? `
                                            <tr>
                                                <td colspan="7" class="py-10 text-center text-slate-400">
                                                    <i class="fas fa-folder-open text-2xl mb-2 block"></i>
                                                    Tidak ada data hasil pengerjaan yang sesuai filter.
                                                </td>
                                            </tr>
                                        ` : filtered.map(r => {
                                            const m = Math.floor(r.timeSpentSeconds / 60);
                                            const s = r.timeSpentSeconds % 60;
                                            return `
                                                <tr class="hover:bg-slate-50/80 transition">
                                                    <td class="py-3.5 px-4">
                                                        <div class="font-bold text-slate-900">${this.escapeHtml(r.studentName)}</div>
                                                        <div class="text-[11px] text-slate-400 font-mono">NIS: ${this.escapeHtml(r.nis)}</div>
                                                    </td>
                                                    <td class="py-3.5 px-4 font-semibold text-slate-700">
                                                        <span class="px-2.5 py-1 rounded-lg bg-slate-100">${this.escapeHtml(r.studentClass)}</span>
                                                    </td>
                                                    <td class="py-3.5 px-4">
                                                        <div class="font-semibold text-slate-800">${this.escapeHtml(r.quizTitle)}</div>
                                                        <div class="text-[11px] text-indigo-600">${this.escapeHtml(r.subject)}</div>
                                                    </td>
                                                    <td class="py-3.5 px-4 text-center font-mono">
                                                        <span class="text-emerald-600 font-bold">${r.correctCount}</span> /
                                                        <span class="text-rose-600 font-bold">${r.wrongCount}</span> /
                                                        <span class="text-slate-400">${r.emptyCount}</span>
                                                    </td>
                                                    <td class="py-3.5 px-4 text-center">
                                                        <span class="text-sm font-extrabold ${r.passed ? 'text-emerald-600' : 'text-rose-600'}">${r.score}</span>
                                                        <span class="block text-[10px] text-slate-400">KKM ${r.kkm}</span>
                                                    </td>
                                                    <td class="py-3.5 px-4 text-center">
                                                        ${r.passed
                                                            ? '<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold text-[11px]">Lulus</span>'
                                                            : '<span class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 font-bold text-[11px]">Remedial</span>'
                                                        }
                                                    </td>
                                                    <td class="py-3.5 px-4 text-slate-500">
                                                        <div>${this.escapeHtml(r.submittedAt)}</div>
                                                        <div class="text-[11px] text-slate-400">Durasi: ${m}m ${s}d</div>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            },

            exportResultsCSV() {
                if (this.state.results.length === 0) {
                    this.showToast('Belum ada data nilai untuk diekspor.', 'warning');
                    return;
                }

                const headers = ['ID Hasil', 'Nama Siswa', 'NIS', 'Kelas', 'Kode Kuis', 'Mata Pelajaran', 'Judul Kuis', 'Benar', 'Salah', 'Kosong', 'Skor Akhir', 'KKM', 'Status', 'Durasi (Detik)', 'Waktu Selesai'];
                const rows = this.state.results.map(r => [
                    r.id,
                    `"${r.studentName.replace(/"/g, '""')}"`,
                    `"${r.nis}"`,
                    `"${r.studentClass}"`,
                    r.quizId,
                    `"${r.subject.replace(/"/g, '""')}"`,
                    `"${r.quizTitle.replace(/"/g, '""')}"`,
                    r.correctCount,
                    r.wrongCount,
                    r.emptyCount,
                    r.score,
                    r.kkm,
                    r.passed ? 'LULUS' : 'REMEDIAL',
                    r.timeSpentSeconds,
                    `"${r.submittedAt}"`
                ]);

                const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
                this.downloadFile(csvContent, `Rekap_Nilai_EduQuiz_${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv;charset=utf-8;');
                this.showToast('Rekap nilai berhasil diunduh dalam format CSV.', 'success');
            },

            clearAllResults() {
                this.showConfirm(
                    'Hapus Seluruh Riwayat Nilai?',
                    'Semua data nilai peserta didik di tabel rekap akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.',
                    () => {
                        this.state.results = [];
                        this.saveResults();
                        this.showToast('Seluruh riwayat nilai telah dibersihkan.', 'success');
                        this.render();
                    },
                    'danger'
                );
            },

            /**
             * ========================================================================
             * UTILITAS UMUM
             * ========================================================================
             */
            downloadFile(content, filename, mimeType) {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },

            escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }
        };

        // Jalankan aplikasi setelah DOM selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
