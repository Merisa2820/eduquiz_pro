            init() {
                this.loadData();
                this.startClock();
                this.render();

            // Muat data dari localStorage atau gunakan Seed Data
            loadData() {
                try {
                    const savedQuizzes = localStorage.getItem(STORAGE_KEYS.QUIZZES);
                    const savedResults = localStorage.getItem(STORAGE_KEYS.RESULTS);

                    if (savedQuizzes) {
                        this.state.quizzes = JSON.parse(savedQuizzes);
                    } else {
                        this.state.quizzes = JSON.parse(JSON.stringify(DEFAULT_QUIZZES));
                        this.saveQuizzes();
                    }

                    if (savedResults) {
                        this.state.results = JSON.parse(savedResults);
                    } else {
                        this.state.results = JSON.parse(JSON.stringify(DEFAULT_RESULTS));
                        this.saveResults();
                    }
                } catch (e) {
                    console.error('Gagal memuat localStorage:', e);
                    this.state.quizzes = JSON.parse(JSON.stringify(DEFAULT_QUIZZES));
                    this.state.results = JSON.parse(JSON.stringify(DEFAULT_RESULTS));
                }
            },

            saveQuizzes() {
                localStorage.setItem(STORAGE_KEYS.QUIZZES, JSON.stringify(this.state.quizzes));

                        this.render();

            // Jam Real-time di Header
            startClock() {
                const updateTime = () => {
                    const now = new Date();
                    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                    
                    const dateStr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
                    const timeStr = now.toTimeString().split(' ')[0] + ' WIB';

                    const elDate = document.getElementById('live-date');
                    const elClock = document.getElementById('live-clock');
                    const elMobile = document.getElementById('live-clock-mobile');

                    if (elDate) elDate.textContent = dateStr;
                    if (elClock) elClock.textContent = timeStr;
                    if (elMobile) elMobile.textContent = timeStr;
                };
                updateTime();
                setInterval(updateTime, 1000);
            },

            // Navigasi antar halaman dengan pengamanan jika sedang ujian
            navigate(view, preselectedQuizId = null) {
                if (this.state.currentView === 'quiz-active' && view !== 'quiz-result') {
                    this.showConfirm(
                        'Ujian Sedang Berlangsung!',
                        'Anda sedang dalam sesi pengerjaan kuis. Jika keluar sekarang, progres pengerjaan Anda akan hilang. Yakin ingin keluar?',
                        () => {
                            this.stopQuizTimer();
                            this._performNavigate(view, preselectedQuizId);
                        },
                        'danger'
                    );
                    return;
                }
                this._performNavigate(view, preselectedQuizId);
            },

            _performNavigate(view, preselectedQuizId) {
                this.state.currentView = view;
                if (preselectedQuizId) {
                    this.state.studentSession.selectedQuizId = preselectedQuizId;
                }
                if (view === 'teacher') {
                    this.state.teacherState.editingQuizId = null;
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            },

            // Update styling tombol navigasi aktif
            updateNavHighlight() {
                const view = this.state.currentView;
                let activeKey = 'home';
                if (['student-login', 'quiz-instructions', 'quiz-active', 'quiz-result'].includes(view)) {
                    activeKey = 'student';
                } else if (view === 'teacher') {
                    activeKey = 'teacher';
                } else if (view === 'analytics') {
                    activeKey = 'analytics';
                }

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const key = btn.getAttribute('data-nav');
                    if (key === activeKey) {
                        btn.className = 'nav-btn px-3.5 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 whitespace-nowrap transition bg-indigo-600 text-white shadow-sm';
                    } else {
                        btn.className = 'nav-btn px-3.5 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 whitespace-nowrap transition text-slate-600 hover:bg-slate-100 hover:text-slate-900';

            /**
             * ========================================================================
             * UI HELPERS: TOAST & MODAL DIALOG
             * ========================================================================
             */
            showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                const styles = {
                    success: 'bg-emerald-600 text-white border-emerald-700',
                    error: 'bg-rose-600 text-white border-rose-700',
                    warning: 'bg-amber-500 text-white border-amber-600',
                    info: 'bg-slate-800 text-white border-slate-900'
                };
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };

                toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 ${styles[type] || styles.info}`;
                toast.innerHTML = `
                    <i class="fas ${icons[type] || icons.info} text-base shrink-0"></i>
                    <span class="flex-1">${message}</span>
                `;

                container.appendChild(toast);
                requestAnimationFrame(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                });

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            },

            showConfirm(title, bodyHtml, onConfirm, variant = 'primary') {
                const modal = document.getElementById('custom-modal');
                const titleEl = document.getElementById('modal-title');
                const bodyEl = document.getElementById('modal-body');
                const confirmBtn = document.getElementById('modal-confirm-btn');
                const cancelBtn = document.getElementById('modal-cancel-btn');
                const iconWrapper = document.getElementById('modal-icon-wrapper');
                const iconEl = document.getElementById('modal-icon');

                titleEl.textContent = title;
                bodyEl.innerHTML = bodyHtml;

                if (variant === 'danger') {
                    iconWrapper.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-rose-100 text-rose-600 shrink-0';
                    iconEl.className = 'fas fa-exclamation-triangle text-lg';
                    confirmBtn.className = 'px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 shadow-sm transition';
                } else {
                    iconWrapper.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600 shrink-0';
                    iconEl.className = 'fas fa-question-circle text-lg';
                    confirmBtn.className = 'px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition';
                }

                modal.classList.remove('hidden');
                modal.classList.add('flex');

                const close = () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                };

                cancelBtn.onclick = close;
                confirmBtn.onclick = () => {
                    close();
                    if (onConfirm) onConfirm();
                };
            },

                                        <div class="text-xl font-extrabold text-emerald-600">${quiz.kkm}</div>
                                        <div class="text-[11px] text-slate-500">Skala 0 - 100</div>
                                    </div>
                                </div>

                                <!-- Tata Tertib -->
                                <div class="bg-amber-50/80 border border-amber-200/80 rounded-2xl p-4">
                                    <h4 class="text-xs font-bold uppercase tracking-wider text-amber-800 mb-2 flex items-center gap-1.5">
                                        <i class="fas fa-exclamation-circle"></i> Petunjuk Pengerjaan Kuis
                                    </h4>
                                    <ul class="text-xs text-amber-900/90 space-y-1.5 list-disc list-inside">
                                        <li>Waktu hitung mundur akan berjalan otomatis segera setelah tombol <strong>Mulai Kuis</strong> ditekan.</li>
                                        <li>Gunakan panel navigasi nomor di sisi kanan untuk berpindah soal dengan cepat.</li>
                                        <li>Tandai <strong>Ragu-ragu</strong> (kuning) jika ingin meninjau kembali soal sebelum dikumpulkan.</li>
                                        <li>Jika waktu habis, sistem akan otomatis menyimpan dan mengumpulkan jawaban Anda.</li>
                                    </ul>
                                </div>

                                <div class="flex items-center justify-between gap-3 pt-2">
                                    <button onclick="app.navigate('student-login')" class="px-5 py-3 rounded-xl text-sm font-semibold text-slate-600 bg-white border border-slate-300 hover:bg-slate-100 transition">
                                        Kembali
                                    </button>
                                    <button onclick="app.startQuiz()" class="flex-1 py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
                                        <i class="fas fa-play"></i>
                                        <span>Mulai Kuis Sekarang</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            /**
             * ========================================================================
             * 2C. MODE SISWA: ANTARMUKA PENGERJAAN KUIS INTERAKTIF
             * ========================================================================
             */
            startQuiz() {
                const s = this.state.studentSession;
                const quiz = s.activeQuiz;
                if (!quiz) return;

                s.currentQuestionIndex = 0;
                s.answers = {};
                s.flagged = {};
                s.totalDurationSeconds = quiz.duration * 60;
                s.remainingSeconds = quiz.duration * 60;

                this.state.currentView = 'quiz-active';
                this.render();
                this.startQuizTimer();
            },

            startQuizTimer() {
                this.stopQuizTimer();
                this.state.studentSession.timerInterval = setInterval(() => {
                    const s = this.state.studentSession;
                    s.remainingSeconds--;

                    const timerEl = document.getElementById('quiz-timer-display');
                    const timerBox = document.getElementById('quiz-timer-box');
                    if (timerEl) {
                        timerEl.textContent = this.formatSeconds(s.remainingSeconds);
                    }
                    if (timerBox && s.remainingSeconds < 60) {
                        timerBox.classList.add('timer-urgent');
                    }

                    if (s.remainingSeconds <= 0) {
                        this.stopQuizTimer();
                        this.showToast('Waktu habis! Jawaban Anda otomatis dikumpulkan.', 'warning');
                        this.submitQuiz(true);
                    }
                }, 1000);
            },

            stopQuizTimer() {
                if (this.state.studentSession.timerInterval) {
                    clearInterval(this.state.studentSession.timerInterval);
                    this.state.studentSession.timerInterval = null;
                }
            },

            formatSeconds(sec) {
                const safeSec = Math.max(0, sec);
                const m = Math.floor(safeSec / 60).toString().padStart(2, '0');
                const s = (safeSec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            },

            selectAnswer(qIdx, value) {
                this.state.studentSession.answers[qIdx] = value;
                this.render();
            },

            handleShortAnswerInput(qIdx, value) {
                if (value.trim() === '') {
                    delete this.state.studentSession.answers[qIdx];
                } else {
                    this.state.studentSession.answers[qIdx] = value;
                }
                // Update status indikator nomor soal tanpa merender ulang input agar fokus tidak hilang
                this.updateQuestionNavGrid();
            },

            toggleFlagQuestion(qIdx) {
                const s = this.state.studentSession;
                s.flagged[qIdx] = !s.flagged[qIdx];
                this.render();
            },

            goToQuestion(qIdx) {
                const quiz = this.state.studentSession.activeQuiz;
                if (qIdx >= 0 && qIdx < quiz.questions.length) {
                    this.state.studentSession.currentQuestionIndex = qIdx;
                    this.render();
                }
            },

            updateQuestionNavGrid() {
                const grid = document.getElementById('question-nav-grid');
                if (!grid) return;
                const s = this.state.studentSession;
                const quiz = s.activeQuiz;

                grid.innerHTML = quiz.questions.map((_, idx) => {
                    const isActive = idx === s.currentQuestionIndex;
                    const isFlagged = !!s.flagged[idx];
                    const isAnswered = s.answers[idx] !== undefined && String(s.answers[idx]).trim() !== '';

                    let btnClass = 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200'; // Belum dijawab
                    if (isAnswered) {
                        btnClass = 'bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600'; // Sudah dijawab
                    }
                    if (isFlagged) {
                        btnClass = 'bg-amber-400 text-slate-900 border-amber-500 hover:bg-amber-500'; // Ragu-ragu
                    }
                    if (isActive) {
                        btnClass += ' ring-2 ring-offset-2 ring-indigo-600 font-extrabold';
                    }

                    return `
                        <button type="button" onclick="app.goToQuestion(${idx})"
                            class="h-10 rounded-xl border text-xs font-bold transition flex items-center justify-center relative ${btnClass}">
                            ${idx + 1}
                            ${isFlagged ? '<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-600 border border-white"></span>' : ''}
                        </button>
                    `;
                }).join('');
            },

            renderQuizActiveView() {
                const s = this.state.studentSession;
                const quiz = s.activeQuiz;
                const qIdx = s.currentQuestionIndex;
                const question = quiz.questions[qIdx];
                const totalQ = quiz.questions.length;
                const currentAnswer = s.answers[qIdx];
                const isFlagged = !!s.flagged[qIdx];
                const isUrgent = s.remainingSeconds < 60;

                const optionLetters = ['A', 'B', 'C', 'D', 'E'];

                // Render area jawaban sesuai tipe soal
                let answerInputHtml = '';
                if (question.type === 'mcq') {
                    answerInputHtml = `
                        <div class="space-y-3">
                            ${question.options.map((opt, optIdx) => {
                                const isSelected = String(currentAnswer) === String(optIdx);
                                return `
                                    <div onclick="app.selectAnswer(${qIdx}, '${optIdx}')"
                                        class="p-4 rounded-2xl border-2 cursor-pointer transition flex items-center gap-3.5 ${isSelected ? 'border-indigo-600 bg-indigo-50/70 shadow-sm' : 'border-slate-200 hover:border-indigo-300 hover:bg-slate-50'}">
                                        <div class="w-9 h-9 rounded-xl font-bold text-sm flex items-center justify-center shrink-0 transition ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">
                                            ${optionLetters[optIdx]}
                                        </div>
                                        <div class="text-sm font-medium text-slate-800 leading-relaxed">${this.escapeHtml(opt)}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                } else if (question.type === 'tf') {
                    answerInputHtml = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${['Benar', 'Salah'].map((label, optIdx) => {
                                const isSelected = String(currentAnswer) === String(optIdx);
                                const icon = optIdx === 0 ? 'fa-check-circle' : 'fa-times-circle';
                                return `
                                    <div onclick="app.selectAnswer(${qIdx}, '${optIdx}')"
                                        class="p-5 rounded-2xl border-2 cursor-pointer transition flex items-center justify-center gap-3 ${isSelected ? 'border-indigo-600 bg-indigo-50/80 shadow-sm' : 'border-slate-200 hover:border-indigo-300 hover:bg-slate-50'}">
                                        <i class="fas ${icon} text-xl ${isSelected ? 'text-indigo-600' : 'text-slate-400'}"></i>
                                        <span class="text-base font-bold ${isSelected ? 'text-indigo-900' : 'text-slate-700'}">${label}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                } else if (question.type === 'short') {
                    answerInputHtml = `
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                                Ketik Jawaban Singkat Anda:
                            </label>
                            <input type="text"
                                value="${this.escapeHtml(currentAnswer || '')}"
                                oninput="app.handleShortAnswerInput(${qIdx}, this.value)"
                                placeholder="Masukkan jawaban singkat di sini..."
                                class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-base font-semibold text-slate-900 bg-white transition">
                            <p class="text-[11px] text-slate-400 mt-2"><i class="fas fa-info-circle mr-1"></i>Penilaian isian singkat tidak membedakan huruf besar/kecil (case-insensitive).</p>
                        </div>
                    `;
                }

                const typeBadges = {
                    mcq: 'Pilihan Ganda',
                    tf: 'Benar / Salah',
                    short: 'Isian Singkat'
                };

                return `
                    <!-- Bar Atas Informasi Peserta & Timer -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center">
                                ${this.escapeHtml(s.name.charAt(0).toUpperCase())}
                            </div>
                            <div>
                                <div class="text-sm font-bold text-slate-900">${this.escapeHtml(s.name)} <span class="text-xs font-normal text-slate-500">(${this.escapeHtml(s.studentClass)})</span></div>
                                <div class="text-xs text-indigo-600 font-semibold">${this.escapeHtml(quiz.title)}</div>
                            </div>
                        </div>

                        <div id="quiz-timer-box" class="flex items-center gap-2.5 px-4 py-2 rounded-xl border bg-slate-50 border-slate-200 transition ${isUrgent ? 'timer-urgent' : ''}">
                            <i class="fas fa-hourglass-half text-sm"></i>
                            <div>
                                <div class="text-[10px] uppercase font-bold tracking-wider opacity-75">Sisa Waktu</div>
                                <div id="quiz-timer-display" class="text-base font-mono font-extrabold leading-none">
                                    ${this.formatSeconds(s.remainingSeconds)}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Grid Utama: Panel Soal (Kiri) & Navigasi Nomor (Kanan) -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <!-- Area Butir Soal -->
                        <div class="lg:col-span-8 bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
                            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-6 border-b border-slate-100">
                                <div class="flex items-center gap-2.5">
                                    <span class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">
                                        Soal No. ${qIdx + 1} / ${totalQ}
                                    </span>
                                    <span class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">
                                        ${typeBadges[question.type] || 'Soal'}
                                    </span>
                                </div>
                                <span class="text-xs font-semibold text-slate-400">
                                    Bobot: ${question.points} Poin
                                </span>
                            </div>

                            <!-- Teks Pertanyaan -->
                            <div class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed mb-7">
                                ${this.escapeHtml(question.text)}
                            </div>

                            <!-- Opsi / Input Jawaban -->
                            <div class="mb-8">
                                ${answerInputHtml}
                            </div>

                            <!-- Tombol Kontrol Navigasi Soal -->
                            <div class="pt-5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                                <button type="button" onclick="app.goToQuestion(${qIdx - 1})" ${qIdx === 0 ? 'disabled' : ''}
                                    class="px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 transition ${qIdx === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                                    <i class="fas fa-chevron-left"></i> Sebelumnya
                                </button>

                                <button type="button" onclick="app.toggleFlagQuestion(${qIdx})"
                                    class="px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 border transition ${isFlagged ? 'bg-amber-400 text-slate-900 border-amber-500 shadow-sm' : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'}">
                                    <i class="fas fa-flag"></i> ${isFlagged ? 'Ditandai Ragu-ragu' : 'Tandai Ragu-ragu'}
                                </button>

                                ${qIdx < totalQ - 1 ? `
                                    <button type="button" onclick="app.goToQuestion(${qIdx + 1})"
                                        class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center gap-2 shadow-sm transition">
                                        Selanjutnya <i class="fas fa-chevron-right"></i>
                                    </button>
                                ` : `
                                    <button type="button" onclick="app.confirmSubmitQuiz()"
                                        class="px-5 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-2 shadow-sm transition">
                                        <i class="fas fa-paper-plane"></i> Selesai & Kumpulkan
                                    </button>
                                `}
                            </div>
                        </div>

                        <!-- Panel Samping: Navigasi Nomor Soal -->
                        <div class="lg:col-span-4 bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
                            <h3 class="text-sm font-bold text-slate-900 mb-4 flex items-center justify-between">
                                <span>Navigasi Nomor Soal</span>
                                <span class="text-xs font-normal text-slate-500">${Object.keys(s.answers).length}/${totalQ} Terjawab</span>
                            </h3>

                            <div id="question-nav-grid" class="grid grid-cols-5 gap-2.5 mb-6">
                                ${quiz.questions.map((_, idx) => {
                                    const isActive = idx === qIdx;
                                    const flagged = !!s.flagged[idx];
                                    const answered = s.answers[idx] !== undefined && String(s.answers[idx]).trim() !== '';

                                    let btnClass = 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200';
                                    if (answered) btnClass = 'bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600';
                                    if (flagged) btnClass = 'bg-amber-400 text-slate-900 border-amber-500 hover:bg-amber-500';
                                    if (isActive) btnClass += ' ring-2 ring-offset-2 ring-indigo-600 font-extrabold';

                                    return `
                                        <button type="button" onclick="app.goToQuestion(${idx})"
                                            class="h-10 rounded-xl border text-xs font-bold transition flex items-center justify-center relative ${btnClass}">
                                            ${idx + 1}
                                        </button>
                                    `;
                                }).join('')}
                            </div>

                            <!-- Legenda Status -->
                            <div class="space-y-2 text-xs text-slate-600 border-t border-slate-100 pt-4 mb-6">
                                <div class="flex items-center gap-2">
                                    <span class="w-4 h-4 rounded bg-emerald-500 inline-block"></span>
                                    <span>Sudah dijawab</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-4 h-4 rounded bg-amber-400 inline-block"></span>
                                    <span>Ragu-ragu</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-4 h-4 rounded bg-slate-100 border border-slate-300 inline-block"></span>
                                    <span>Belum dijawab</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-4 h-4 rounded bg-white ring-2 ring-indigo-600 inline-block"></span>
                                    <span>Soal sedang aktif</span>
                                </div>
                            </div>

                            <button type="button" onclick="app.confirmSubmitQuiz()"
                                class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
                                <i class="fas fa-check-double"></i> Selesai & Kumpulkan
                            </button>
                        </div>
                    </div>
                `;
            },

            confirmSubmitQuiz() {
                const s = this.state.studentSession;
                const totalQ = s.activeQuiz.questions.length;
                let answeredCount = 0;
                let flaggedCount = 0;

                for (let i = 0; i < totalQ; i++) {
                    if (s.answers[i] !== undefined && String(s.answers[i]).trim() !== '') {
                        answeredCount++;
                    }
                    if (s.flagged[i]) flaggedCount++;
                }

                const unansweredCount = totalQ - answeredCount;

                let warningHtml = `
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-1.5 mb-3 text-xs">
                        <div class="flex justify-between"><span>Total Soal:</span> <strong>${totalQ} Soal</strong></div>
                        <div class="flex justify-between text-emerald-700"><span>Sudah Dijawab:</span> <strong>${answeredCount} Soal</strong></div>
                        <div class="flex justify-between text-rose-600"><span>Belum Dijawab:</span> <strong>${unansweredCount} Soal</strong></div>
                        ${flaggedCount > 0 ? `<div class="flex justify-between text-amber-600"><span>Ditandai Ragu-ragu:</span> <strong>${flaggedCount} Soal</strong></div>` : ''}
                    </div>
                    <p>Apakah Anda yakin ingin mengakhiri ujian dan mengumpulkan semua jawaban sekarang?</p>
                `;

                this.showConfirm('Konfirmasi Pengumpulan Kuis', warningHtml, () => {
                    this.submitQuiz(false);
                });
            },

            submitQuiz(isAutoSubmit = false) {
                this.stopQuizTimer();
                const s = this.state.studentSession;
                const quiz = s.activeQuiz;
                if (!quiz) return;

                let earnedPoints = 0;
                let maxPoints = 0;
                let correctCount = 0;
                let wrongCount = 0;
                let emptyCount = 0;

                quiz.questions.forEach((q, idx) => {
                    const pts = Number(q.points) || 10;
                    maxPoints += pts;
                    const userAns = s.answers[idx];

                    if (userAns === undefined || String(userAns).trim() === '') {
                        emptyCount++;
                    } else {
                        let isCorrect = false;
                        if (q.type === 'short') {
                            isCorrect = String(userAns).trim().toLowerCase() === String(q.answer).trim().toLowerCase();
                        } else {
                            isCorrect = String(userAns) === String(q.answer);
                        }

                        if (isCorrect) {
                            earnedPoints += pts;
                            correctCount++;
                        } else {
                            wrongCount++;
                        }
                    }
                });

                const finalScore = maxPoints > 0 ? Math.round((earnedPoints / maxPoints) * 100) : 0;
                const passed = finalScore >= quiz.kkm;
                const timeSpentSeconds = Math.max(1, s.totalDurationSeconds - s.remainingSeconds);

                const now = new Date();
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                const submittedAt = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}, ${now.toTimeString().slice(0, 5)}`;

                const resultRecord = {
                    id: 'RES-' + Date.now().toString().slice(-6),
                    studentName: s.name,
                    nis: s.nis,
                    studentClass: s.studentClass,
                    quizId: quiz.id,
                    quizTitle: quiz.title,
                    subject: quiz.subject,
                    score: finalScore,
                    kkm: quiz.kkm,
                    passed,
                    correctCount,
                    wrongCount,
                    emptyCount,
                    totalQuestions: quiz.questions.length,
                    timeSpentSeconds,
                    submittedAt,
                    answers: { ...s.answers }
                };

                this.state.results.unshift(resultRecord);
                this.saveResults();
                s.lastResult = resultRecord;

                if (!isAutoSubmit) {
                    this.showToast('Kuis berhasil dikumpulkan!', 'success');
                }

                this.state.currentView = 'quiz-result';
                this.render();
            },

            /**
             * ========================================================================
             * 2D. MODE SISWA: HALAMAN HASIL & PEMBAHASAN OTOMATIS
             * ========================================================================
             */
            renderQuizResultView() {
                const res = this.state.studentSession.lastResult;
                const quiz = this.state.studentSession.activeQuiz;
                if (!res || !quiz) return this.renderHomeView();

                const mins = Math.floor(res.timeSpentSeconds / 60);
                const secs = res.timeSpentSeconds % 60;
                const optionLetters = ['A', 'B', 'C', 'D', 'E'];

                return `
                    <div id="printable-area" class="max-w-4xl mx-auto space-y-6">
                        <!-- Kartu Sertifikat / Skor Utama -->
                        <div class="bg-white rounded-3xl border-2 ${res.passed ? 'border-emerald-200' : 'border-rose-200'} shadow-lg overflow-hidden">
                            <div class="bg-gradient-to-r ${res.passed ? 'from-emerald-600 to-teal-600' : 'from-rose-600 to-orange-600'} px-6 py-8 text-white text-center relative">
                                <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/20 text-xs font-bold uppercase tracking-wider mb-3">
                                    <i class="fas ${res.passed ? 'fa-award' : 'fa-redo'}"></i>
                                    ${res.passed ? 'Lulus Kriteria Ketuntasan Minimal (KKM)' : 'Belum Mencapai KKM (Remedial)'}
                                </div>
                                <h2 class="text-2xl sm:text-3xl font-extrabold mb-1">${this.escapeHtml(res.studentName)}</h2>
                                <p class="text-xs sm:text-sm text-white/90">NIS: ${this.escapeHtml(res.nis)} &bull; Kelas: ${this.escapeHtml(res.studentClass)} &bull; ${this.escapeHtml(res.submittedAt)}</p>

                                <div class="mt-6 inline-flex flex-col items-center justify-center w-32 h-32 rounded-full bg-white text-slate-900 shadow-xl border-4 ${res.passed ? 'border-emerald-200' : 'border-rose-200'}">
                                    <span class="text-[11px] font-bold uppercase text-slate-400">Skor Akhir</span>
                                    <span class="text-4xl font-extrabold ${res.passed ? 'text-emerald-600' : 'text-rose-600'}">${res.score}</span>
                                    <span class="text-[11px] font-semibold text-slate-500">KKM: ${res.kkm}</span>
                                </div>
                            </div>

                            <!-- Rincian Statistik Pengerjaan -->
                            <div class="p-6 sm:p-8">
                                <div class="text-center mb-6">
                                    <div class="text-xs font-bold uppercase tracking-wider text-indigo-600">${this.escapeHtml(res.subject)}</div>
                                    <div class="text-lg font-bold text-slate-900">${this.escapeHtml(res.quizTitle)}</div>
                                </div>

                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                                    <div class="bg-emerald-50 border border-emerald-100 p-3.5 rounded-2xl text-center">
                                        <div class="text-xs text-emerald-700 font-medium">Jawaban Benar</div>
                                        <div class="text-xl font-extrabold text-emerald-700">${res.correctCount}</div>
                                    </div>
                                    <div class="bg-rose-50 border border-rose-100 p-3.5 rounded-2xl text-center">
                                        <div class="text-xs text-rose-700 font-medium">Jawaban Salah</div>
                                        <div class="text-xl font-extrabold text-rose-700">${res.wrongCount}</div>
                                    </div>
                                    <div class="bg-slate-100 border border-slate-200 p-3.5 rounded-2xl text-center">
                                        <div class="text-xs text-slate-600 font-medium">Tidak Dijawab</div>
                                        <div class="text-xl font-extrabold text-slate-700">${res.emptyCount}</div>
                                    </div>
                                    <div class="bg-indigo-50 border border-indigo-100 p-3.5 rounded-2xl text-center">
                                        <div class="text-xs text-indigo-700 font-medium">Waktu Pengerjaan</div>
                                        <div class="text-xl font-extrabold text-indigo-700">${mins}m ${secs}d</div>
                                    </div>
                                </div>

                                <div class="flex flex-wrap items-center justify-center gap-3 no-print">
                                    <button onclick="window.print()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold flex items-center gap-2 transition shadow-sm">
                                        <i class="fas fa-print"></i> Cetak Sertifikat / Hasil
                                    </button>
                                    <button onclick="app.navigate('analytics')" class="px-5 py-2.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-semibold flex items-center gap-2 transition">
                                        <i class="fas fa-chart-bar"></i> Lihat Rekap Nilai Kelas
                                    </button>
                                    <button onclick="app.navigate('home')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold flex items-center gap-2 transition shadow-sm">
                                        <i class="fas fa-home"></i> Kembali ke Beranda
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Pembahasan Lengkap Per Nomor Soal -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
                            <h3 class="text-lg font-bold text-slate-900 mb-1 flex items-center gap-2">
                                <i class="fas fa-book-open text-indigo-600"></i> Review & Pembahasan Jawaban
                            </h3>
                            <p class="text-xs text-slate-500 mb-6">Evaluasi setiap butir soal beserta kunci jawaban dan penjelasan materi.</p>

                            <div class="space-y-5">
                                ${quiz.questions.map((q, idx) => {
                                    const userRaw = res.answers[idx];
                                    const isEmpty = userRaw === undefined || String(userRaw).trim() === '';
                                    let isCorrect = false;
                                    let userDisplay = 'Tidak dijawab';
                                    let keyDisplay = '';

                                    if (q.type === 'mcq') {
                                        isCorrect = !isEmpty && String(userRaw) === String(q.answer);
                                        if (!isEmpty) userDisplay = `${optionLetters[userRaw]}. ${q.options[userRaw]}`;
                                        keyDisplay = `${optionLetters[q.answer]}. ${q.options[q.answer]}`;
                                    } else if (q.type === 'tf') {
                                        const tfLabels = ['Benar', 'Salah'];
                                        isCorrect = !isEmpty && String(userRaw) === String(q.answer);
                                        if (!isEmpty) userDisplay = tfLabels[userRaw];
                                        keyDisplay = tfLabels[q.answer];
                                    } else {
                                        isCorrect = !isEmpty && String(userRaw).trim().toLowerCase() === String(q.answer).trim().toLowerCase();
                                        if (!isEmpty) userDisplay = userRaw;
                                        keyDisplay = q.answer;
                                    }

                                    const statusBadge = isEmpty
                                        ? '<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold">Kosong</span>'
                                        : isCorrect
                                            ? '<span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-700 text-xs font-bold"><i class="fas fa-check mr-1"></i>Benar</span>'
                                            : '<span class="px-2.5 py-1 rounded-lg bg-rose-100 text-rose-700 text-xs font-bold"><i class="fas fa-times mr-1"></i>Salah</span>';

                                    return `
                                        <div class="p-5 rounded-2xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200 bg-slate-50/40'}">
                                            <div class="flex items-center justify-between gap-2 mb-2.5">
                                                <span class="text-xs font-extrabold text-indigo-700">Pertanyaan #${idx + 1}</span>
                                                ${statusBadge}
                                            </div>
                                            <p class="text-sm font-semibold text-slate-900 mb-4">${this.escapeHtml(q.text)}</p>
                                            
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs mb-3">
                                                <div class="p-3 rounded-xl bg-white border ${isCorrect ? 'border-emerald-200' : 'border-rose-200'}">
                                                    <span class="text-slate-400 block mb-0.5">Jawaban Anda:</span>
                                                    <strong class="${isEmpty ? 'text-slate-400 italic' : isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${this.escapeHtml(userDisplay)}</strong>
                                                </div>
                                                <div class="p-3 rounded-xl bg-white border border-emerald-200">
                                                    <span class="text-slate-400 block mb-0.5">Kunci Jawaban:</span>
                                                    <strong class="text-emerald-700">${this.escapeHtml(keyDisplay)}</strong>
                                                </div>
                                            </div>

                                            ${q.explanation ? `
                                                <div class="p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-100 text-xs text-slate-700 leading-relaxed">
                                                    <strong class="text-indigo-800"><i class="fas fa-lightbulb text-amber-500 mr-1"></i>Pembahasan:</strong> ${this.escapeHtml(q.explanation)}
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

            /**
             * ========================================================================
             * 3. MODE GURU / MANAJEMEN KUIS & BANK SOAL (CRUD + JSON IMPORT/EXPORT)
             * ========================================================================
             */
            renderTeacherView() {
                if (this.state.teacherState.editingQuizId !== null) {
                    return this.renderTeacherQuizEditor();
                }

                return `
                    <div class="space-y-6">
                        <!-- Header Mode Guru -->
                        <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Panel Administrator & Pendidik</span>
                                <h2 class="text-2xl font-extrabold text-slate-900 mt-1">Manajemen Paket Kuis & Bank Soal</h2>
                                <p class="text-xs text-slate-500 mt-1">Buat paket ujian baru, kelola butir soal berbagai tipe, atau ekspor/impor file JSON bank soal.</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2.5">
                                <label class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer transition flex items-center gap-2">
                                    <i class="fas fa-file-import text-indigo-600"></i> Import JSON
                                    <input type="file" accept=".json" onchange="app.importQuizJSON(event)" class="hidden">
                                </label>
                                <button onclick="app.exportAllQuizzesJSON()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center gap-2">
                                    <i class="fas fa-file-export text-emerald-600"></i> Export Semua JSON
                                </button>
                                <button onclick="app.openQuizEditor('NEW')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md transition flex items-center gap-2">
                                    <i class="fas fa-plus"></i> Buat Paket Kuis Baru
                                </button>
                            </div>
                        </div>

                        <!-- Tabel / Daftar Paket Kuis -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            ${this.state.quizzes.map(quiz => `
                                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between gap-2 mb-3">
                                            <span class="px-3 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-bold">${this.escapeHtml(quiz.subject)}</span>
                                            <span class="text-xs font-mono text-slate-400">${this.escapeHtml(quiz.id)}</span>
                                        </div>
                                        <h3 class="text-lg font-bold text-slate-900 mb-1.5">${this.escapeHtml(quiz.title)}</h3>
                                        <p class="text-xs text-slate-500 mb-4 line-clamp-2">${this.escapeHtml(quiz.description || 'Tidak ada deskripsi.')}</p>
                                    </div>

                                    <div>
                                        <div class="flex items-center gap-4 text-xs text-slate-600 bg-slate-50 px-3.5 py-2.5 rounded-xl mb-4">
                                            <span><i class="fas fa-list-ol text-indigo-500 mr-1"></i><strong>${quiz.questions.length}</strong> Soal</span>
                                            <span><i class="fas fa-clock text-amber-500 mr-1"></i><strong>${quiz.duration}</strong> Menit</span>
                                            <span><i class="fas fa-check-circle text-emerald-500 mr-1"></i>KKM <strong>${quiz.kkm}</strong></span>
                                        </div>

                                        <div class="flex items-center gap-2">
                                            <button onclick="app.openQuizEditor('${quiz.id}')" class="flex-1 py-2 px-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs transition flex items-center justify-center gap-1.5">
                                                <i class="fas fa-edit"></i> Edit Paket & Soal
                                            </button>
                                            <button onclick="app.exportSingleQuizJSON('${quiz.id}')" title="Export JSON Paket Ini" class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs transition">
                                                <i class="fas fa-download"></i>
                                            </button>
                                            <button onclick="app.deleteQuiz('${quiz.id}')" title="Hapus Paket" class="py-2 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs transition">
                                                <i class="fas fa-trash-alt"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            openQuizEditor(quizId) {
                if (quizId === 'NEW') {
                    this.state.teacherState.editingQuizId = 'NEW';
                    this.state.teacherState.draftQuiz = {
                        id: 'QZ-' + Math.random().toString(36).substring(2, 6).toUpperCase() + '-' + Math.floor(10 + Math.random() * 90),
                        title: '',
                        subject: '',
                        duration: 15,
                        kkm: 75,
                        description: '',
                        questions: [
                            {
                                id: 'q_' + Date.now(),
                                type: 'mcq',
                                text: '',
                                options: ['', '', '', '', ''],
                                answer: '0',
                                points: 25,
                                explanation: ''
                            }
                        ]
                    };
                } else {
                    const existing = this.state.quizzes.find(q => q.id === quizId);
                    if (!existing) return;
                    this.state.teacherState.editingQuizId = quizId;
                    this.state.teacherState.draftQuiz = JSON.parse(JSON.stringify(existing));
                }
                this.render();
            },

            syncDraftMetaFromInputs() {
                const draft = this.state.teacherState.draftQuiz;
                if (!draft) return;
                const elTitle = document.getElementById('draft-title');
                const elSubject = document.getElementById('draft-subject');
                const elDuration = document.getElementById('draft-duration');
                const elKkm = document.getElementById('draft-kkm');
                const elDesc = document.getElementById('draft-desc');

                if (elTitle) draft.title = elTitle.value;
                if (elSubject) draft.subject = elSubject.value;
                if (elDuration) draft.duration = parseInt(elDuration.value, 10) || 10;
                if (elKkm) draft.kkm = parseInt(elKkm.value, 10) || 75;
                if (elDesc) draft.description = elDesc.value;
            },

            addDraftQuestion() {
                this.syncDraftMetaFromInputs();
                const draft = this.state.teacherState.draftQuiz;
                draft.questions.push({
                    id: 'q_' + Date.now() + '_' + draft.questions.length,
                    type: 'mcq',
                    text: '',
                    options: ['', '', '', '', ''],
                    answer: '0',
                    points: 20,
                    explanation: ''
                });
                this.render();
            },

            removeDraftQuestion(qIdx) {
                this.syncDraftMetaFromInputs();
                const draft = this.state.teacherState.draftQuiz;
                if (draft.questions.length <= 1) {
                    this.showToast('Minimal harus terdapat 1 butir soal dalam paket kuis.', 'warning');
                    return;
                }
                draft.questions.splice(qIdx, 1);
                this.render();
            },

            changeDraftQuestionType(qIdx, newType) {
                this.syncDraftMetaFromInputs();
                const q = this.state.teacherState.draftQuiz.questions[qIdx];
                q.type = newType;
                if (newType === 'mcq') {
                    q.options = ['', '', '', '', ''];
                    q.answer = '0';
                } else if (newType === 'tf') {
                    q.options = ['Benar', 'Salah'];
                    q.answer = '0';
                } else if (newType === 'short') {
                    q.options = [];
                    q.answer = '';
                }
                this.render();
            },

            updateDraftQuestionField(qIdx, field, value, optIdx = null) {
                const q = this.state.teacherState.draftQuiz.questions[qIdx];
                if (!q) return;
                if (field === 'option' && optIdx !== null) {
                    q.options[optIdx] = value;
                } else if (field === 'points') {
                    q.points = parseInt(value, 10) || 10;
                } else {
                    q[field] = value;
                }
            },

            saveDraftQuiz(e) {
                e.preventDefault();
                this.syncDraftMetaFromInputs();
                const draft = this.state.teacherState.draftQuiz;

                if (!draft.title.trim() || !draft.subject.trim()) {
                    this.showToast('Judul Kuis dan Mata Pelajaran wajib diisi!', 'error');
                    return;
                }

                for (let i = 0; i < draft.questions.length; i++) {
                    const q = draft.questions[i];
                    if (!q.text.trim()) {
                        this.showToast(`Teks pertanyaan pada Soal #${i + 1} belum diisi!`, 'error');
                        return;
                    }
                    if (q.type === 'mcq' && q.options.some(opt => !opt.trim())) {
                        this.showToast(`Semua opsi jawaban (A-E) pada Soal #${i + 1} wajib diisi!`, 'error');
                        return;
                    }
                    if (q.type === 'short' && !String(q.answer).trim()) {
                        this.showToast(`Kunci jawaban isian singkat pada Soal #${i + 1} wajib diisi!`, 'error');
                        return;
                    }
                }

                if (this.state.teacherState.editingQuizId === 'NEW') {
                    this.state.quizzes.unshift(draft);
                    this.showToast('Paket kuis baru berhasil ditambahkan!', 'success');
                } else {
                    const idx = this.state.quizzes.findIndex(q => q.id === draft.id);
                    if (idx !== -1) {
                        this.state.quizzes[idx] = draft;
                    }
                    this.showToast('Perubahan paket kuis berhasil disimpan!', 'success');
                }

                this.saveQuizzes();
                this.state.teacherState.editingQuizId = null;
                this.state.teacherState.draftQuiz = null;
                this.render();
            },

            deleteQuiz(quizId) {
                if (this.state.quizzes.length <= 1) {
                    this.showToast('Minimal harus tersisa 1 paket kuis di dalam sistem.', 'warning');
                    return;
                }
                this.showConfirm(
                    'Hapus Paket Kuis?',
                    'Paket kuis beserta seluruh butir soal di dalamnya akan dihapus permanen. Lanjutkan?',
                    () => {
                        this.state.quizzes = this.state.quizzes.filter(q => q.id !== quizId);
                        this.saveQuizzes();
                        this.showToast('Paket kuis berhasil dihapus.', 'success');
                        this.render();
                    },
                    'danger'
                );
            },

            renderTeacherQuizEditor() {
                const draft = this.state.teacherState.draftQuiz;
                const isNew = this.state.teacherState.editingQuizId === 'NEW';
                const optionLetters = ['A', 'B', 'C', 'D', 'E'];

                return `
                    <form onsubmit="app.saveDraftQuiz(event)" class="max-w-4xl mx-auto space-y-6">
                        <div class="flex items-center justify-between gap-4">
                            <button type="button" onclick="app.navigate('teacher')" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 transition flex items-center gap-2">
                                <i class="fas fa-arrow-left"></i> Kembali ke Daftar Kuis
                            </button>
                            <span class="text-xs font-mono bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg font-bold">
                                Kode Paket: ${this.escapeHtml(draft.id)}
                            </span>
                        </div>

                        <!-- Pengaturan Umum Paket Kuis -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
                            <h2 class="text-xl font-extrabold text-slate-900 mb-5">
                                ${isNew ? 'Buat Paket Kuis Baru' : 'Edit Paket Kuis & Butir Soal'}
                            </h2>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Judul Paket Kuis *</label>
                                    <input type="text" id="draft-title" required value="${this.escapeHtml(draft.title)}"
                                        placeholder="Contoh: Ulangan Harian Trigonometri"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Mata Pelajaran *</label>
                                    <input type="text" id="draft-subject" required value="${this.escapeHtml(draft.subject)}"
                                        placeholder="Contoh: Matematika Wajib"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-sm">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Durasi Pengerjaan (Menit) *</label>
                                    <input type="number" id="draft-duration" min="1" max="180" required value="${draft.duration}"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Nilai KKM (0 - 100) *</label>
                                    <input type="number" id="draft-kkm" min="1" max="100" required value="${draft.kkm}"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Total Butir Soal</label>
                                    <input type="text" disabled value="${draft.questions.length} Pertanyaan"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 text-sm font-semibold">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Deskripsi Singkat Kuis</label>
                                <input type="text" id="draft-desc" value="${this.escapeHtml(draft.description)}"
                                    placeholder="Keterangan ruang lingkup materi yang diujikan..."
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-sm">
                            </div>
                        </div>

                        <!-- Daftar Editor Butir Soal -->
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-bold text-slate-900">Daftar Butir Pertanyaan (${draft.questions.length})</h3>
                                <button type="button" onclick="app.addDraftQuestion()" class="px-4 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold transition flex items-center gap-1.5">
                                    <i class="fas fa-plus"></i> Tambah Soal
                                </button>
                            </div>

                            ${draft.questions.map((q, qIdx) => `
                                <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
                                    <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-100">
                                        <span class="px-3 py-1 rounded-lg bg-indigo-600 text-white text-xs font-bold">Soal #${qIdx + 1}</span>
                                        <div class="flex flex-wrap items-center gap-2">
                                            <select onchange="app.changeDraftQuestionType(${qIdx}, this.value)"
                                                class="px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-semibold bg-slate-50 outline-none">
                                                <option value="mcq" ${q.type === 'mcq' ? 'selected' : ''}>Pilihan Ganda (A-E)</option>
                                                <option value="tf" ${q.type === 'tf' ? 'selected' : ''}>Benar / Salah</option>
                                                <option value="short" ${q.type === 'short' ? 'selected' : ''}>Isian Singkat</option>
                                            </select>

                                            <div class="flex items-center gap-1 bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-1">
                                                <span class="text-[11px] text-slate-500">Bobot:</span>
                                                <input type="number" min="1" max="100" value="${q.points}"
                                                    oninput="app.updateDraftQuestionField(${qIdx}, 'points', this.value)"
                                                    class="w-12 text-xs font-bold text-slate-800 bg-transparent outline-none text-center">
                                            </div>

                                            <button type="button" onclick="app.removeDraftQuestion(${qIdx})"
                                                class="p-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs transition" title="Hapus Soal Ini">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 mb-1">Teks Pertanyaan *</label>
                                            <textarea rows="2" required oninput="app.updateDraftQuestionField(${qIdx}, 'text', this.value)"
                                                placeholder="Tuliskan soal atau pertanyaan di sini..."
                                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-sm">${this.escapeHtml(q.text)}</textarea>
                                        </div>

                                        <!-- Area Opsi & Kunci Berdasarkan Tipe Soal -->
                                        ${q.type === 'mcq' ? `
                                            <div class="space-y-2.5">
                                                <label class="block text-xs font-bold text-slate-600">Pilihan Jawaban & Tandai Kunci Jawaban Benar:</label>
                                                ${q.options.map((opt, optIdx) => `
                                                    <div class="flex items-center gap-2.5">
                                                        <input type="radio" name="correct_${qIdx}" value="${optIdx}" ${String(q.answer) === String(optIdx) ? 'checked' : ''}
                                                            onchange="app.updateDraftQuestionField(${qIdx}, 'answer', '${optIdx}')"
                                                            class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 cursor-pointer" title="Jadikan Kunci Jawaban">
                                                        <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">${optionLetters[optIdx]}</span>
                                                        <input type="text" required value="${this.escapeHtml(opt)}"
                                                            oninput="app.updateDraftQuestionField(${qIdx}, 'option', this.value, ${optIdx})"
                                                            placeholder="Teks pilihan ${optionLetters[optIdx]}..."
                                                            class="flex-1 px-3 py-2 rounded-xl border border-slate-300 focus:border-indigo-500 outline-none text-xs">
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : q.type === 'tf' ? `
                                            <div>
                                                <label class="block text-xs font-bold text-slate-600 mb-1.5">Kunci Jawaban Benar / Salah:</label>
                                                <div class="flex gap-4">
                                                    <label class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 cursor-pointer bg-slate-50">
                                                        <input type="radio" name="correct_${qIdx}" value="0" ${String(q.answer) === '0' ? 'checked' : ''}
                                                            onchange="app.updateDraftQuestionField(${qIdx}, 'answer', '0')">
                                                        <span class="text-xs font-bold text-emerald-700">Benar</span>
                                                    </label>
                                                    <label class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 cursor-pointer bg-slate-50">
                                                        <input type="radio" name="correct_${qIdx}" value="1" ${String(q.answer) === '1' ? 'checked' : ''}
                                                            onchange="app.updateDraftQuestionField(${qIdx}, 'answer', '1')">
                                                        <span class="text-xs font-bold text-rose-700">Salah</span>
                                                    </label>
                                                </div>
                                            </div>
                                        ` : `
                                            <div>
                                                <label class="block text-xs font-bold text-slate-600 mb-1">Kunci Jawaban Isian Singkat *</label>
                                                <input type="text" required value="${this.escapeHtml(q.answer)}"
                                                    oninput="app.updateDraftQuestionField(${qIdx}, 'answer', this.value)"
                                                    placeholder="Contoh: 40 atau fotosintesis"
                                                    class="w-full px-3.5 py-2 rounded-xl border border-emerald-300 bg-emerald-50/30 focus:border-emerald-500 outline-none text-sm font-semibold">
                                            </div>
                                        `}

                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 mb-1">Pembahasan / Penjelasan Materi (Ditampilkan setelah kuis selesai)</label>
                                            <input type="text" value="${this.escapeHtml(q.explanation || '')}"
                                                oninput="app.updateDraftQuestionField(${qIdx}, 'explanation', this.value)"
                                                placeholder="Tuliskan langkah penyelesaian atau alasan jawaban benar..."
                                                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 outline-none text-xs">
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Tombol Simpan Akhir -->
                        <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-3 sticky bottom-4 shadow-lg">
                            <button type="button" onclick="app.addDraftQuestion()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center gap-2">
                                <i class="fas fa-plus-circle text-indigo-600"></i> Tambah Butir Soal Lagi
                            </button>
                            <div class="flex items-center gap-2.5">
                                <button type="button" onclick="app.navigate('teacher')" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold transition">
                                    Batal
                                </button>
                                <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md transition flex items-center gap-2">
                                    <i class="fas fa-save"></i> Simpan Paket Kuis
                                </button>
                            </div>
                        </div>
                    </form>
                `;
            },

            exportSingleQuizJSON(quizId) {
                const quiz = this.state.quizzes.find(q => q.id === quizId);
                if (!quiz) return;
                this.downloadFile(JSON.stringify([quiz], null, 2), `${quiz.id}_bank_soal.json`, 'application/json');
                this.showToast(`Paket kuis ${quiz.id} berhasil diunduh (JSON).`, 'success');
            },

            exportAllQuizzesJSON() {
                this.downloadFile(JSON.stringify(this.state.quizzes, null, 2), `eduquiz_semua_bank_soal.json`, 'application/json');
                this.showToast('Seluruh bank soal berhasil diekspor ke JSON.', 'success');
            },

            importQuizJSON(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        const importedList = Array.isArray(parsed) ? parsed : [parsed];
                        let addedCount = 0;

                        importedList.forEach(item => {
                            if (item && item.title && item.subject && Array.isArray(item.questions) && item.questions.length > 0) {
                                // Buat ID unik jika bentrok
                                if (this.state.quizzes.some(q => q.id === item.id)) {
                                    item.id = 'QZ-IMP-' + Math.floor(100 + Math.random() * 900);
                                }
                                this.state.quizzes.unshift(item);
                                addedCount++;
                            }
                        });

                        if (addedCount > 0) {
                            this.saveQuizzes();
                            this.showToast(`Berhasil mengimpor ${addedCount} paket kuis!`, 'success');
                            this.render();
                        } else {
                            this.showToast('Format JSON kuis tidak valid atau kosong.', 'error');
                        }
                    } catch (err) {
                        this.showToast('Gagal membaca file JSON. Pastikan format valid.', 'error');
                    }
                    event.target.value = '';
                };
                reader.readAsText(file);
            },

            /**
             * ========================================================================
             * 4. DASHBOARD REKAP NILAI & ANALITIK HASIL BELAJAR
             * ========================================================================
             */
            updateAnalyticsFilter(key, value) {
                this.state.analyticsFilter[key] = value;
                this.render();
            },

            renderAnalyticsView() {
                const f = this.state.analyticsFilter;
                const allResults = this.state.results;

                // Filter hasil
                const filtered = allResults.filter(r => {
                    const matchSearch = r.studentName.toLowerCase().includes(f.search.toLowerCase()) ||
                                        r.nis.toLowerCase().includes(f.search.toLowerCase());
                    const matchClass = f.classFilter === 'ALL' || r.studentClass === f.classFilter;
                    const matchQuiz = f.quizFilter === 'ALL' || r.quizId === f.quizFilter;
                    return matchSearch && matchClass && matchQuiz;
                });

                // Hitung Statistik Analitik dari data terfilter
                const count = filtered.length;
                const avgScore = count > 0 ? Math.round(filtered.reduce((acc, r) => acc + r.score, 0) / count) : 0;
                const maxScore = count > 0 ? Math.max(...filtered.map(r => r.score)) : 0;
                const minScore = count > 0 ? Math.min(...filtered.map(r => r.score)) : 0;
                const passedCount = filtered.filter(r => r.passed).length;
                const remedialCount = count - passedCount;
                const passRate = count > 0 ? Math.round((passedCount / count) * 100) : 0;

                const uniqueClasses = [...new Set(allResults.map(r => r.studentClass))].sort();

                return `
                    <div class="space-y-6">
                        <!-- Header Analitik -->
                        <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
